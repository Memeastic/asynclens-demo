<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AsyncLens Simple — Events</title>
  <style>
    body{font-family:system-ui,Arial;margin:0;background:#08101a;color:#dbe8f5}
    header{padding:12px 16px;background:#061021;border-bottom:1px solid rgba(255,255,255,0.03);display:flex;align-items:center;gap:12px}
    main{display:flex;gap:12px;padding:12px}
    #events{width:640px;max-height:70vh;overflow:auto;background:#061425;padding:12px;border-radius:8px}
    .ev{padding:8px;margin-bottom:8px;border-radius:6px;background:linear-gradient(90deg,#04202b,#071827);font-size:13px}
    pre{white-space:pre-wrap;color:#bfe}
    #controls{display:flex;gap:8px}
    button{padding:6px 8px;border-radius:6px;border:0;background:#7c3aed;color:white}
  </style>
</head>
<body>
  <header>
    <div style="font-weight:700;font-size:16px">AsyncLens Simple</div>
    <div id="controls"><button id="clear">Clear</button><button id="export">Export JSON</button><button id="test">Send Test</button></div>
  </header>
  <main>
    <div id="events">Loading events…</div>
    <div style="flex:1;max-width:360px">
      <h3>Inspector</h3>
      <div id="inspector">Select an event</div>
    </div>
  </main>

  <script src="options.js"></script>
</body>
</html>
