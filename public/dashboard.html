<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AsyncLens Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- vis-network CDN -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <h1>AsyncLens Dashboard</h1>
  <div id="wrap">
    <div id="network" style="flex:1; height:600px; border:1px solid #ddd;"></div>
    <div id="panel" style="width:320px; border-left:1px solid #ddd; padding:8px; box-sizing:border-box;">
      <h3>Events</h3>
      <div id="events" style="font-family:monospace; font-size:12px; overflow:auto; height:540px;"></div>
    </div>
  </div>

  <script src="/event-graph.js"></script>
  <script>
    // start connection to same host/ws
    const loc = window.location;
    const wsProtocol = loc.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl = wsProtocol + '://' + loc.host;
    startAsyncLensDashboard(wsUrl);
  </script>
</body>
</html>
