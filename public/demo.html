<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AsyncLens Demo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <h1>AsyncLens Demo App</h1>
  <div>
    <button id="btn-fetch">Trigger fetch -> json -> setTimeout</button>
    <button id="btn-promise">Trigger chained promises</button>
  </div>

  <pre id="log"></pre>

  <script src="/instrumentation.js"></script>
  <script>
    const log = v => {
      const p = document.getElementById('log');
      p.textContent = (new Date()).toLocaleTimeString() + ' - ' + v + '\n' + p.textContent;
    };

    document.getElementById('btn-fetch').addEventListener('click', async () => {
      log('Starting fetch flow');
      // Using a public fast API for demo; CORS allowed
      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/todos/1');
        const data = await res.json();
        log('fetch json received: ' + JSON.stringify(data));
        setTimeout(() => {
          log('timer callback executed after fetch');
        }, 800);
      } catch (e) {
        log('fetch error: ' + e);
      }
    });

    document.getElementById('btn-promise').addEventListener('click', () => {
      log('Starting promise chain');
      new Promise((resolve) => {
        setTimeout(() => resolve(2), 200);
      })
      .then(x => {
        log('first then: ' + x);
        return x * 2;
      })
      .then(y => {
        log('second then: ' + y);
        if (y === 4) throw new Error('demo error');
        return y;
      })
      .catch(e => {
        log('caught: ' + e);
      });
    });
  </script>
</body>
</html>
